{% extends "base.html" %}
{% block titulo_pagina %}Editar Autor: {{ author.nameAuthor }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 mb-0 text-accent-primary"><i class="bi bi-pencil-square"></i> Modificar Autor</h2>
            <a href="{{ url_for('author.index') }}" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>

        <div class="card shadow-lg">
            <div class="card-body p-4">
                <form action="{{ url_for('author.edit', id=author.idAuthor) }}" method="post">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="nameAuthor" class="form-label small text-uppercase fw-bold text-dim">Nombre Completo</label>
                            <input type="text" id="nameAuthor" name="nameAuthor" class="form-control" value="{{ author.nameAuthor }}" required>
                        </div>

                        <div class="col-md-12">
                            <label for="nationalityAuthor" class="form-label small text-uppercase fw-bold text-dim">Nacionalidad</label>
                            <input type="text" id="nationalityAuthor" name="nationalityAuthor" class="form-control" value="{{ author.nationalityAuthor }}" required>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-arrow-repeat"></i> Actualizar Autor
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
