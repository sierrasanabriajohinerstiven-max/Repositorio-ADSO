{% extends "base.html" %}
{% block titulo_pagina %}Agregar Etiqueta{% endblock %}
{% block content %}
<form action="{{ url_for('tag.add') }}" method="post" class="needs-validation" novalidate>
    <div class="form-group mb-3">
        <label for="nombre" class="form-label">Nombre de la Etiqueta:</label>
        <input type="text" id="nombre" name="nombre" required class="form-control">
        <div class="invalid-feedback">Por favor, ingrese un nombre para la etiqueta.</div>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar Etiqueta</button>
        <a href="{{ url_for('tag.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
