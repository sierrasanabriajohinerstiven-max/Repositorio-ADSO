{% extends "base.html" %}
{% block titulo_pagina %}Buscar Etiquetas{% endblock %}
{% block content %}
<form action="{{ url_for('tag.filter') }}" method="post">
    <div class="form-group mb-4">
        <label for="query" class="form-label">Nombre de la etiqueta:</label>
        <input type="text" name="query" id="query" class="form-control" placeholder="Ej: Ficción, Ciencia..." required>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-info text-white"><i class="bi bi-search"></i> Buscar</button>
        <a href="{{ url_for('tag.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
