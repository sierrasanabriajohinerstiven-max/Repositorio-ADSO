{% extends "base.html" %}
{% block titulo_pagina %}Filtrar Publicaciones por Etiqueta{% endblock %}
{% block content %}
<form action="{{ url_for('post.filter') }}" method="post">
    <div class="form-group mb-4">
        <label for="etiqueta" class="form-label">Seleccione una Etiqueta:</label>
        <select name="etiqueta" id="etiqueta" class="form-select" required>
            <option value="" disabled selected>-- Elija una etiqueta --</option>
            {% for etiqueta in etiquetas %}
            <option value="{{ etiqueta.idEtiqueta }}">{{ etiqueta.nombreEtiqueta }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-info text-white"><i class="bi bi-search"></i> Filtrar</button>
        <a href="{{ url_for('post.index') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
