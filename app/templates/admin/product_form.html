{% extends "base.html" %}
{% block content %}
<h2 class="text-warning mb-4">
    <i class="fa-solid fa-plus-circle"></i> Nuevo Producto
</h2>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card p-4">
            <form method="POST" action="">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre del Chocolate</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ product.name if product else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Descripción</label>
                    <textarea class="form-control" id="description" name="description" rows="3" required>{{ product.description if product else '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Precio ($)</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price if product else '' }}" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="stock" class="form-label">Stock Inicial</label>
                        <input type="number" class="form-control" id="stock" name="stock" value="{{ product.stock if product else 0 }}" required>
                    </div>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary-custom">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
