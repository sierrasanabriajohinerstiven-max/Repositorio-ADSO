{% extends "base.html" %}
{% block content %}
<h2 class="text-warning mb-4"><i class="fa-solid fa-money-check-dollar"></i> Finalizar Compra</h2>

<div class="row">
    <div class="col-md-8 mb-4">
        <div class="card p-4">
            <h4 class="text-bone mb-3 border-bottom border-secondary pb-2">Datos de Envío y Pago</h4>
            <form method="POST" action="">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="address" class="form-label">Dirección de Envío</label>
                    <input type="text" class="form-control" id="address" name="address" required placeholder="Ej: Calle 123 #45-67, Bogotá">
                </div>
                <div class="mb-4">
                    <label for="phone" class="form-label">Teléfono de Contacto</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required placeholder="Ej: 3001234567">
                </div>
                
                <h5 class="mb-3 text-bone">Método de Pago</h5>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="payment_method" id="pago_efectivo" value="efectivo" checked>
                    <label class="form-check-label text-bone" for="pago_efectivo">
                        <i class="fa-solid fa-money-bill-wave text-success me-2"></i>Efectivo (Contra Entrega)
                    </label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="radio" name="payment_method" id="pago_nequi" value="nequi">
                    <label class="form-check-label" for="pago_nequi" style="color: #c984f5;">
                        <i class="fa-solid fa-mobile-screen-button me-2"></i>Nequi
                    </label>
                </div>
                
                <div id="nequi_fields" style="display: none;" class="p-3 bg-dark border border-warning rounded mb-4">
                    <h5 class="text-warning mb-3"><i class="fa-solid fa-file-invoice"></i> Datos para el recibo</h5>
                    <div class="mb-3">
                        <label for="customer_name" class="form-label text-bone">Nombre Completo</label>
                        <input type="text" class="form-control" id="customer_name" name="customer_name" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="mb-3">
                        <label for="customer_email" class="form-label text-bone">Correo Electrónico</label>
                        <input type="email" class="form-control" id="customer_email" name="customer_email" value="{{ current_user.email }}">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 btn-lg">Confirmar Pedido</button>
            </form>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-4 bg-dark border-warning">
            <h4 class="text-warning mb-3">Resumen</h4>
            <div class="d-flex justify-content-between mb-2 text-bone">
                <span>Subtotal:</span>
                <span>${{ "%.2f"|format(total) }}</span>
            </div>
            <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2 text-bone">
                <span>Envío:</span>
                <span>Gratis</span>
            </div>
            <div class="d-flex justify-content-between text-bone">
                <span class="fs-5 fw-bold">Total:</span>
                <span class="fs-5 fw-bold text-warning">${{ "%.2f"|format(total) }}</span>
            </div>
        </div>
    </div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const radioEfectivo = document.getElementById('pago_efectivo');
    const radioNequi = document.getElementById('pago_nequi');
    const nequiFields = document.getElementById('nequi_fields');
    const nameInput = document.getElementById('customer_name');
    const emailInput = document.getElementById('customer_email');

    function toggleNequi() {
        if (radioNequi.checked) {
            nequiFields.style.display = 'block';
            nameInput.required = true;
            emailInput.required = true;
        } else {
            nequiFields.style.display = 'none';
            nameInput.required = false;
            emailInput.required = false;
        }
    }

    radioEfectivo.addEventListener('change', toggleNequi);
    radioNequi.addEventListener('change', toggleNequi);
});
</script>
{% endblock %}
